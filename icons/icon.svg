<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <title>Denge: a level beam in balance, a plate of greens on one side and a brass weight on the other</title>
  <rect width="512" height="512" rx="112" fill="#15201B"/>
  <g id="art" transform="translate(0 -26)">
    <!-- The plate, with food in it -->
    <path d="M84 226h144a72 50 0 0 1-144 0z" fill="#ECEFE8"/>
    <circle cx="124" cy="212" r="26" fill="#2BB596"/>
    <circle cx="166" cy="204" r="30" fill="#D9A23A"/>
    <circle cx="200" cy="218" r="20" fill="#2BB596"/>
    <!-- The brass weight -->
    <rect x="320" y="196" width="100" height="94" rx="14" fill="#D9A23A"/>
    <!-- The beam, level, with its graduations -->
    <rect x="62" y="290" width="388" height="28" rx="6" fill="#ECEFE8"/>
    <path d="M318 330v18M360 330v18M402 330v18" stroke="#9BA39C" stroke-width="10"/>
    <!-- The point it balances on -->
    <path d="M256 318 206 418h100z" fill="#ECEFE8"/>
  </g>
</svg>
